title: devsec
description: Local security scanning for coding agents
theme: just-the-docs

url: https://chiodi-unicc.github.io
baseurl: /devsec

aux_links:
  GitHub: https://github.com/chiodi-unicc/devsec
aux_links_new_tab: true

search_enabled: true
heading_anchors: true
color_scheme: light

# Internal notes, not published.
exclude:
  - optimisations.md
  - Gemfile
  - Gemfile.lock
  - vendor

mermaid:
  version: "11.4.1"

defaults:
  - scope:
      path: ""
    values:
      layout: default

callouts:
  prototype:
    title: Prototype
    color: yellow
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: red

footer_content: "devsec is licensed under the <a href=\"https://github.com/chiodi-unicc/devsec/blob/main/LICENSE\">Apache License 2.0</a>."
